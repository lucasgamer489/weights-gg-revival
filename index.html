<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weights.gg Revival</title>
    <style>
        /* PALETA CLARA E ORIGINAL DO WEIGHTS.GG */
        :root {
            --bg-body: #f8f9fa;        /* Fundo cinza ultra-claro clássico */
            --bg-card: #ffffff;        /* Blocos e cartões brancos destacados */
            --border-gray: #eef1f4;    /* Linhas finas e discretas */
            --text-dark: #0f1115;      /* Preto para títulos principais */
            --text-muted: #656e7b;     /* Cinza médio para textos secundários */
            --search-bg: #f1f3f5;      /* Fundo do campo de busca */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            min-height: 100vh;
        }

        /* TOPBAR DO MODULO CLARO */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 2000;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            cursor: pointer;
        }

        .topbar-nav {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .nav-item {
            cursor: pointer;
            padding-bottom: 4px;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: var(--text-dark);
        }

        .nav-item.active {
            color: var(--text-dark);
            border-bottom: 2px solid var(--text-dark);
        }

        .search-container {
            position: relative;
            width: 360px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 36px;
            background-color: var(--search-bg);
            border: 1px solid transparent;
            border-radius: 24px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .search-input:focus {
            outline: none;
            border-color: #cbd5e1;
            background-color: var(--bg-card);
        }

        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.4;
        }

        /* ESTRUTURA DUAS COLUNAS PRINCIPAL FIXADA */
        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 96px 32px 32px 32px;
            gap: 32px;
        }

        /* COLUNA DA ESQUERDA (SIDEBAR) */
        .sidebar-left {
            width: 255px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-gray);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .panel-card h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 700;
        }

        .quick-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s;
        }

        .option-row:hover {
            background-color: var(--search-bg);
        }

        .option-row:active {
            transform: scale(0.98);
        }

        .option-row.img-mode { border-left: 3.5px solid #facc15; }
        .option-row.song-mode { border-left: 3.5px solid #4ade80; }
        .option-row.vid-mode { border-left: 3.5px solid #f87171; }
        .option-row.cov-mode { border-left: 3.5px solid #3b82f6; }

        .btn-discord-sidebar {
            width: 100%;
            background-color: var(--text-dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 14px;
            transition: opacity 0.2s;
        }

        .btn-discord-sidebar:hover {
            opacity: 0.9;
        }

        /* COLUNA DA DIREITA (FEED) */
        .main-feed {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .welcome-banner {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.01);
        }

        .welcome-banner h2 {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .welcome-banner p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .categories-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .filter-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gray);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--text-dark);
            color: white;
            border-color: var(--text-dark);
        }

        /* GRID E CARTÕES DOS MODELOS */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .voice-hub-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .voice-hub-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        .card-cover-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            background-color: #e2e8f0;
        }

        .card-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-footer-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-grow: 1;
        }

        .card-footer-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .card-footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 10px;
        }

        .btn-use-text {
            background: none;
            border: none;
            color: var(--text-dark);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.78rem;
        }

        .btn-use-text:hover {
            text-decoration: underline;
        }

        /* PAINEL IMPORTAÇÃO DE ENGENHARIA REVERSA */
        .import-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 20px 0;
        }

        .import-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: var(--search-bg);
        }

        .import-input:focus {
            outline: none;
            border-color: var(--text-dark);
        }

        .btn-submit-model {
            background-color: var(--text-dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
